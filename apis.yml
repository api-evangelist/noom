apis:
- aid: noom:noom-content-api
  name: Noom Content API (WordPress REST)
  description: 'The anonymously readable WordPress/Altis REST API that backs the noom.com
    marketing site and the Noom blog. Discovered by probing https://www.noom.com/wp-json/,
    which returns a 200 route index advertising 390 routes across 23 namespaces, including
    the standard wp/v2 content endpoints (posts, pages, media, categories, tags, taxonomies,
    types) and a first-party noom/v1 namespace used for public-URL generation and cache
    purging. This is the content API of Noom''s CMS, not a Noom product API — Noom
    publishes no developer portal, no OpenAPI and no SDKs. Recorded because it is the
    one real, publicly callable, self-describing surface on a Noom host.'
  humanURL: https://www.noom.com/wp-json/
  baseURL: https://www.noom.com/wp-json/wp/v2
