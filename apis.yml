aid: noom
name: Noom
description: 'Noom, Inc. is a New York-based digital health company founded in 2008
  by Saeju Jeong and Artem Petakov, best known for a psychology-based weight-management
  mobile app that pairs behaviour-change coursework and human coaching with food logging,
  activity tracking and, through Noom Med, clinician-prescribed GLP-1 medication. Alongside
  the direct-to-consumer subscription, Noom sells to employers, health plans and health
  systems through Noom Healthy Weight, Noom Diabetes Prevention, the Noom GLP-1 Companion
  and a Noom Med Center of Excellence. Noom publishes no public developer portal, no
  OpenAPI/GraphQL contract and no client SDKs; its application host api.noom.com answers
  every anonymous request with HTTP 401 UNAUTHENTICATED, and health-system integration
  is described only as a business capability ("we can integrate into major EHR platforms")
  with no published specification. The only anonymously callable machine-readable surface
  found is the WordPress/Altis REST API behind the noom.com marketing and blog site.'
